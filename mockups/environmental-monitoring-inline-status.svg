<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="760" viewBox="0 0 1520 760" role="img" aria-labelledby="title desc">
  <title id="title">Environmental monitoring inline status bar concepts</title>
  <desc id="desc">Four variations of a compact environmental monitoring status banner.</desc>
  <defs>
    <linearGradient id="page" x2="0" y2="1"><stop stop-color="#f8fbf8"/><stop offset="1" stop-color="#f1f6f2"/></linearGradient>
    <linearGradient id="green" x2="1" y2="1"><stop stop-color="#eaf8ec"/><stop offset="1" stop-color="#d9f1df"/></linearGradient>
    <linearGradient id="dark" x2="1" y2="1"><stop stop-color="#063b31"/><stop offset="1" stop-color="#0d6045"/></linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#183d2a" flood-opacity=".08"/></filter>
  </defs>

  <rect width="1520" height="760" fill="url(#page)"/>
  <text x="50" y="45" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#16392d">Environmental monitoring · inline status concepts</text>
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="14" fill="#6a8274">Four compact alternatives for the sensor network strip</text>

  <text x="50" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#5b7868">01  CLASSIC STATUS</text>
  <rect x="50" y="125" width="1420" height="105" rx="14" fill="url(#green)" stroke="#72bf7a" filter="url(#shadow)"/>
  <circle cx="90" cy="178" r="16" fill="#bee8c5"/>
  <circle cx="90" cy="178" r="9" fill="#21863e"/>
  <text x="122" y="169" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#075c32">Environmental Monitoring Active</text>
  <text x="122" y="195" font-family="Arial, sans-serif" font-size="14" fill="#2e7148">1 sensor connected  ·  Last update 2 min ago</text>
  <rect x="1340" y="153" width="100" height="50" rx="9" fill="#f4fff5" stroke="#73bb7b"/>
  <circle cx="1366" cy="178" r="5" fill="#1e9a46"/>
  <text x="1380" y="184" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#075c32">Live</text>

  <text x="50" y="277" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#5b7868">02  QUICK CONDITIONS</text>
  <rect x="50" y="290" width="1420" height="105" rx="14" fill="#ffffff" stroke="#d6e8db" filter="url(#shadow)"/>
  <rect x="50" y="290" width="7" height="105" rx="3" fill="#2b9c55"/>
  <circle cx="96" cy="342" r="24" fill="#e6f6e9"/>
  <path d="M96 327 C88 337 87 343 96 355 C105 343 104 337 96 327Z" fill="none" stroke="#218a48" stroke-width="3"/>
  <text x="136" y="337" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173b2a">Field conditions are live</text>
  <text x="136" y="362" font-family="Arial, sans-serif" font-size="14" fill="#61776a">Field Sensor 01 is sending environmental readings</text>
  <rect x="835" y="316" width="165" height="52" rx="12" fill="#f5faf6" stroke="#e2efe5"/>
  <text x="853" y="337" font-family="Arial, sans-serif" font-size="12" fill="#758b7b">TEMPERATURE</text>
  <text x="853" y="357" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173b2a">28.4°C</text>
  <rect x="1012" y="316" width="155" height="52" rx="12" fill="#f5faf6" stroke="#e2efe5"/>
  <text x="1030" y="337" font-family="Arial, sans-serif" font-size="12" fill="#758b7b">HUMIDITY</text>
  <text x="1030" y="357" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173b2a">72%</text>
  <rect x="1295" y="320" width="130" height="44" rx="22" fill="#e5f7e9"/>
  <circle cx="1320" cy="342" r="5" fill="#27a64e"/>
  <text x="1336" y="348" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#147342">Connected</text>

  <text x="50" y="442" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#5b7868">03  LIVE TELEMETRY</text>
  <rect x="50" y="455" width="1420" height="105" rx="14" fill="url(#dark)" filter="url(#shadow)"/>
  <circle cx="92" cy="507" r="22" fill="#1f7558"/>
  <circle cx="92" cy="507" r="8" fill="#87e5a5"/>
  <circle cx="92" cy="507" r="13" fill="none" stroke="#87e5a5" opacity=".55"/>
  <text x="128" y="502" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Environmental data streaming</text>
  <text x="128" y="529" font-family="Arial, sans-serif" font-size="14" fill="#b8e2c9">1 connected sensor  ·  Updated just now</text>
  <line x1="810" y1="477" x2="810" y2="538" stroke="#5ca481" opacity=".65"/>
  <text x="846" y="494" font-family="Arial, sans-serif" font-size="12" fill="#a6d3b9">AIR TEMPERATURE</text>
  <text x="846" y="523" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">28.4°C</text>
  <text x="1030" y="494" font-family="Arial, sans-serif" font-size="12" fill="#a6d3b9">SOIL MOISTURE</text>
  <text x="1030" y="523" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">38%</text>
  <rect x="1310" y="480" width="125" height="52" rx="9" fill="#d9f9df"/>
  <text x="1339" y="512" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0b5c32">View data →</text>

  <text x="50" y="607" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#5b7868">04  MINIMAL MONITORING</text>
  <rect x="50" y="620" width="1420" height="91" rx="14" fill="#ffffff" stroke="#d4e6d9" filter="url(#shadow)"/>
  <rect x="75" y="642" width="46" height="46" rx="12" fill="#e8f7ec"/>
  <path d="M86 665 h5 l4 -10 l6 19 l4 -9 h6" fill="none" stroke="#238b4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="139" y="657" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#173b2a">Environmental Monitoring</text>
  <text x="139" y="682" font-family="Arial, sans-serif" font-size="14" fill="#687e70">Air, soil, and weather readings are available</text>
  <rect x="910" y="643" width="130" height="44" rx="22" fill="#edf8f0"/>
  <circle cx="932" cy="665" r="5" fill="#2ba659"/>
  <text x="946" y="671" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#187243">1 online</text>
  <rect x="1053" y="643" width="148" height="44" rx="22" fill="#f1f6f2"/>
  <text x="1071" y="671" font-family="Arial, sans-serif" font-size="14" fill="#3d624c">Updated 2m ago</text>
  <text x="1308" y="671" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#167a42">Open monitor →</text>
</svg>
